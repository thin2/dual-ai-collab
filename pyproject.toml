[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-ai-collab"
version = "0.1.0"
description = "Task execution and verification tools for AI collaboration"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
analytics = ["psutil>=5.9"]
test = ["pytest>=7"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
