# Ruff configuration for dual-ai-collab

target-version = "py39"

# The legacy skill is frozen and not linted: its scripts, and the tests and fixture that exist only for them.
extend-exclude = [
    "skill/scripts",
    "tests/fixtures/fake_app_server.py",
    "tests/test_adapter_backend.py",
    "tests/test_adapter_protocols.py",
    "tests/test_config.py",
    "tests/test_error_handling.py",
    "tests/test_execution_flow.py",
    "tests/test_planning_integration.py",
    "tests/test_run_improvements.py",
    "tests/test_run_store_pytest.py",
    "tests/test_run_task_pytest.py",
    "tests/test_session_backend.py",
    "tests/test_structured_logging.py",
    "tests/test_task_board.py",
    "tests/test_task_manager_pytest.py",
    "tests/test_tasks_store_pytest.py",
    "tests/test_verify_cli_pytest.py",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

ignore = [
    "E501",   # line too long - let formatter handle it
    "B008",   # function call in default argument
    "SIM108", # use ternary instead of if-else - sometimes clearer as is
]

[lint.per-file-ignores]
"tests/*.py" = ["B011"]  # assert False in tests is fine
