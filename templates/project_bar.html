<div class="project-bar">
    <div class="project-picker">
        <label for="projectSelect">当前项目</label>
        <select id="projectSelect" aria-label="切换项目">
            {% for item in projects %}
            <option value="{{ item.id }}" {% if item.id == project.id %}selected{% endif %} {% if not item.available %}disabled{% endif %}>{{ item.name }}{% if not item.available %} · 路径不可用{% endif %}</option>
            {% endfor %}
        </select>
        <span class="project-path" title="{{ project.path }}">{{ project.path }}</span>
    </div>
    <button class="register-toggle" id="registerToggle" aria-expanded="false" aria-controls="registerProject">登记项目 ＋</button>
</div>
<form id="registerProject" class="register-project" hidden>
    <p>登记已有文件夹，任务和记录保留在各自项目中。</p>
    <div class="register-fields">
        <label>项目名称<input name="name" required maxlength="100" placeholder="例如：客户门户" autocomplete="off"></label>
        <label>项目目录<input name="path" required placeholder="/Users/你的用户名/projects/项目目录" autocomplete="off" spellcheck="false"></label>
        <button type="submit" class="register-submit">登记并打开</button>
    </div>
    <p id="projectMessage" role="status"></p>
</form>
<script>
    const projectId = {{ project.id | tojson }};
    const projectApi = '/api/projects/' + encodeURIComponent(projectId);
    const projectPage = '/project/' + encodeURIComponent(projectId);
</script>
<script src="/static/js/projects.js" defer></script>
